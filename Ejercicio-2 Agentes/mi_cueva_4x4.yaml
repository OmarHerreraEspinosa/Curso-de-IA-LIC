# Mi cueva personalizada 4x4
# (1, 1) is the bottom-left cave. The agent starts there, facing east.

grid:
  width: 4
  height: 4

agent:
  start: [1, 1]
  direction: east
  arrows: 1

wumpus: [2, 2]

pits:
  - [1, 3]
  - [3, 4]
  - [4, 1]

gold: [4, 2]

scoring:
  gold: 1000
  death: -1000
  step: -1
  shoot: -10

max_steps: 200
